apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchain-deployment
  labels:
    app: blockchain
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blockchain
  template:
    metadata:
      labels:
        app: blockchain
    spec:
      imagePullSecrets:
        - name: redlab
      containers:
      - name: node
        image: redlabteam/blockchain
        imagePullPolicy: Always
      volumes:
      - name: blockchain-persistent-storage
        persistentVolumeClaim:
          claimName: blockchain-claim