apiVersion: v1
kind: PersistentVolume
metadata:
  name: blockchain-master-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/mnt/data-blockchain-master"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blockchain-master-claim
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi