version: '3.7'
services:
  # Node.js private key finder
  node:
    build: ./
    image: redlabteam/private-key-finder
    ports:
      - 3333:3333
    environment:
      WORKER_NAME: "Duduch-macbook"
      MASTER_API_URL: http://blockchain-master:3334
    container_name: private-key-finder
    volumes:
      - ./keys/:/app/keys/
    networks:
    - test
  blockchain-master:
    build: ./blockchain-master
    image: redlabteam/blockchain-master
    ports:
      - 3334:3334
    container_name: blockchain-master
    volumes:
      - ./blockchain-master/generators:/blockchain-master/generators
      - ./blockchain-master/jackpot.txt:/blockchain-master/jackpot.txt
      - private:/blockchain-master/datadir
    networks:
    - test
volumes:
  private:
  master:

networks:
  test: