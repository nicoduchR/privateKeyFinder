version: '3.7'
services:
  # Blockchain
  blockchain:
    build: ./blockchain
    image: redlabteam/blockchain
    container_name: blockchain
    ports:
      - 8501:8501
    volumes:
      - private:/datadir
    networks:
    - test
  # Node.js private key finder
  node:
    build: ./
    image: redlabteam/private-key-finder
    ports:
      - 3333:3333
    environment:
      WORKER_NAME: "Duduch-macbook"
      MASTER_API_URL: http://ns3101731.ip-54-36-123.eu:3334
    container_name: private-key-finder
    volumes:
      - ./keys/:/app/keys/
    networks:
    - test
  master:
    build: ./master-api
    image: redlabteam/master-api
    ports:
      - 3334:3334
    container_name: master-api
    volumes:
      - ./master-api/generators:/master-api/generators
    networks:
    - test
volumes:
  private:
  master:

networks:
  test: