version: '3.7'
services:
  # Blockchain
  blockchain:
    build: ./blockchain
    image: redlabteam/blockchain
    container_name: blockchain
    ports:
      - 8501:8501
    volumes:
      - private:/datadir
    networks:
    - test
  # Node.js private key finder
  node:
    build: ./
    image: redlabteam/private-key-finder
    ports:
      - 3000:3000
    environment:
      MASTER_API_URL: http://ec2-35-180-0-170.eu-west-3.compute.amazonaws.com:3001
    container_name: private-key-finder
    volumes:
      - ./keys/:/app/keys/
    networks:
    - test
  master:
    build: ./master-api
    image: redlabteam/master-api
    ports:
      - 3001:3001
    environment:
      DB_USERNAME: "username"
    container_name: master-api
    volumes:
      - ./master-api:/master-api
    networks:
    - test
volumes:
  private:
  master:

networks:
  test: